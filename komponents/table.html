
<div class="custom-table-shell">
<link rel="stylesheet" href="../styles/table.css">

<table style="table-layout: fixed;" class="custom-table">
    <thead class="thead-labels">
    <tr>
        <th class="align-top">
            <a class='sort' data-sortfld='' style="cursor: pointer;">
            <span class="column-label"></span>
            <i class='fas fa-sort-up sort-up'  style='display: none'></i>
            <i class='fas fa-sort-down sort-down' style='display: none'></i>
            <i class='fas fa-sort sort-default'></i>
            </a>
        </th>
    </tr>
    </thead>
    <thead class="thead-filters"></thead>
    <tbody class="before-main-tbody"></tbody>
    <tbody class="main-tbody"></tbody>
    <tbody class="after-main-tbody"></tbody>
    <tbody class="no-data-tbody"><tr><td>Nu exista inregistrari care sa indeplineasca criterile de cautare</td></tr>

                <button name="last" class="btn btn-sm btn-outline-secondary" title="140">&gt;&gt;</button>
                </div>

                    <option>25</option>
                    <option>50</option>
                    <option>75</option>
                </select> inregistrari pe pagina. Total <span class="totalrecscount"></span>

</div>
